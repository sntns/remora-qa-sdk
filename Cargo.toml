[workspace]
resolver = "3"
members = [
    "components/qa-plugin-example",
    "components/qa-plugin-protocol",
    "components/qa-plugin-sdk",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sntns/remora-qa-sdk"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
unused_variables = { level = "allow", priority = 1 }
dead_code = { level = "allow", priority = 1 }

[workspace.lints.clippy]
all = "warn"
