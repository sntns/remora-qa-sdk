name: Release and Publish

# One-click release (see PUBLISHING.md): cargo-release bumps the version of
# the published crates, publishes them to crates.io (protocol, then SDK),
# then commits, tags and pushes (Cargo.toml's [workspace.metadata.release]).
# "current" publishes the version in Cargo.toml as it is (the first release).
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Release level"
        required: true
        default: patch
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Release with cargo-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-release --locked

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - run: cargo release ${{ inputs.level != 'current' && inputs.level || '' }} --workspace --execute --no-confirm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
